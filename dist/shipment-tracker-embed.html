<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argus Shipping - Real-Time Shipment Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

    :root {
      --accent: #F5B037;
      --accent-bright: #F5E070;
      --accent-glow: rgba(245, 176, 55, 0.35);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: #080c14;
      color: #eef2ff;
      padding: 1.5rem;
    }

    @keyframes goldGlowPulse {
      0% { transform: scale(0.95); opacity: 0.75; box-shadow: 0 0 10px rgba(245, 176, 55, 0.4); }
      50% { transform: scale(1.25); opacity: 1; box-shadow: 0 0 25px rgba(245, 176, 55, 0.85); }
      100% { transform: scale(0.95); opacity: 0.75; box-shadow: 0 0 10px rgba(245, 176, 55, 0.4); }
    }

    .node-active-halo {
      animation: goldGlowPulse 2s infinite ease-in-out;
    }

    .dashed-header-line {
      border-top: 2px dashed rgba(245, 176, 55, 0.35);
    }

    .smooth-width {
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-5xl bg-slate-900/90 border border-amber-500/20 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden backdrop-blur-md">
    
    <div class="absolute -top-24 -right-24 w-72 h-72 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- 1. SEARCH INPUT SECTION -->
    <div class="mb-8 relative z-10">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
        <h2 class="text-2xl font-extrabold text-white flex items-center gap-3">
          <i data-lucide="package" class="w-7 h-7 text-amber-400"></i>
          Shipment Tracking
        </h2>
        <span class="inline-flex items-center gap-2 px-3 py-1 bg-amber-950/60 border border-amber-500/30 text-amber-400 text-xs font-bold rounded-full uppercase tracking-wider">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
          Argus Live Tracking Network
        </span>
      </div>

      <form id="trackForm" class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
          <input 
            type="text" 
            id="rfqInput"
            value=""
            placeholder="Enter Ref Number (e.g. ARG-2408261 or ARG-2408261-1)..."
            class="w-full pl-12 pr-4 py-3.5 bg-slate-950/80 border border-amber-500/20 rounded-xl text-white font-semibold text-base focus:outline-none focus:border-amber-400 focus:ring-4 focus:ring-amber-500/20 transition-all placeholder:text-slate-500"
          />
        </div>
        <button 
          type="submit" 
          id="trackBtn"
          class="px-7 py-3.5 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-black rounded-xl shadow-lg shadow-amber-500/30 transition-all flex items-center justify-center gap-2 whitespace-nowrap active:scale-95"
        >
          <i data-lucide="search" class="w-5 h-5 stroke-[2.5]"></i>
          Track Shipment
        </button>
      </form>
      <div id="errorMsg" class="hidden text-red-400 font-semibold text-sm mt-2"></div>
    </div>

    <!-- TRACKER CONTENT DISPLAY -->
    <div id="trackerContent" class="space-y-8 hidden">
      
      <!-- 2. TOP HEADER METADATA -->
      <div class="relative flex flex-col md:flex-row items-center justify-between p-6 bg-slate-950/60 border border-amber-500/15 rounded-2xl gap-6">
        
        <div class="hidden md:block absolute top-1/2 left-36 right-36 h-0.5 dashed-header-line -translate-y-1/2 pointer-events-none z-0"></div>

        <div class="relative z-10 md:absolute md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 px-4 py-1.5 bg-slate-900 border border-amber-400 rounded-full text-xs font-bold text-amber-400 flex items-center gap-2 shadow-lg shadow-amber-950/50">
          <i data-lucide="plane" class="w-4 h-4 text-amber-400"></i>
          <span id="modeDisplay">Air Freight</span>
        </div>

        <div class="relative z-10 bg-slate-900/90 px-4 py-2 rounded-xl text-left w-full md:w-auto border border-slate-800">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-0.5">Origin</div>
          <div id="originCountry" class="text-xl font-extrabold text-white">—</div>
          <div id="originCity" class="text-base font-bold text-amber-400">—</div>
        </div>

        <div class="relative z-10 bg-slate-900/90 px-4 py-2 rounded-xl text-left md:text-right w-full md:w-auto border border-slate-800">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-0.5">Destination</div>
          <div id="destCountry" class="text-xl font-extrabold text-white">—</div>
          <div id="destCity" class="text-base font-bold text-amber-400">—</div>
        </div>
      </div>

      <!-- 3. DETAILS CARDS -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 pt-4 border-t border-slate-800">
        <div class="p-4 bg-slate-950/40 border border-slate-800/60 rounded-xl flex items-center gap-3">
          <div class="p-2.5 bg-amber-500/10 text-amber-400 rounded-lg"><i data-lucide="shield-check" class="w-5 h-5"></i></div>
          <div>
            <div class="text-xs font-semibold text-slate-400 uppercase">Ref No</div>
            <div id="rfqRefDisplay" class="text-sm font-bold text-white">—</div>
          </div>
        </div>

        <div class="p-4 bg-slate-950/40 border border-slate-800/60 rounded-xl flex items-center gap-3">
          <div class="p-2.5 bg-amber-500/10 text-amber-400 rounded-lg"><i data-lucide="calendar" class="w-5 h-5"></i></div>
          <div>
            <div class="text-xs font-semibold text-slate-400 uppercase">ETA Date</div>
            <div id="etaDisplay" class="text-sm font-bold text-white">—</div>
          </div>
        </div>

        <div class="p-4 bg-slate-950/40 border border-slate-800/60 rounded-xl flex items-center gap-3">
          <div class="p-2.5 bg-amber-500/10 text-amber-400 rounded-lg"><i data-lucide="truck" class="w-5 h-5"></i></div>
          <div>
            <div class="text-xs font-semibold text-slate-400 uppercase">Carrier</div>
            <div id="carrierDisplay" class="text-sm font-bold text-white">—</div>
          </div>
        </div>

        <div class="p-4 bg-slate-950/40 border border-slate-800/60 rounded-xl flex items-center gap-3">
          <div class="p-2.5 bg-amber-500/10 text-amber-400 rounded-lg"><i data-lucide="package" class="w-5 h-5"></i></div>
          <div>
            <div class="text-xs font-semibold text-slate-400 uppercase">G.W. / C.W.</div>
            <div id="weightDisplay" class="text-sm font-bold text-white">—</div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    lucide.createIcons();

    document.getElementById('trackForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const val = document.getElementById('rfqInput').value.trim();
      const errorEl = document.getElementById('errorMsg');
      const contentEl = document.getElementById('trackerContent');

      errorEl.classList.add('hidden');
      errorEl.innerText = '';
      contentEl.classList.add('hidden');

      if (!val) {
        errorEl.innerText = 'Please enter a valid Reference Number.';
        errorEl.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch(`/api/track/${encodeURIComponent(val)}`);
        const json = await res.json();
        if (json.success && json.data) {
          const d = json.data;
          document.getElementById('originCountry').innerText = d.origin.country || '—';
          document.getElementById('originCity').innerText = d.origin.city || '—';
          document.getElementById('destCountry').innerText = d.destination.country || '—';
          document.getElementById('destCity').innerText = d.destination.city || '—';
          document.getElementById('modeDisplay').innerText = d.mode || 'Freight';
          document.getElementById('rfqRefDisplay').innerText = d.ref_no || val;
          document.getElementById('etaDisplay').innerText = d.eta || 'N/A';
          document.getElementById('carrierDisplay').innerText = d.carrier || '—';
          document.getElementById('weightDisplay').innerText = d.gross_weight || d.chargeable_weight || d.weight || '—';
          contentEl.classList.remove('hidden');
        } else {
          errorEl.innerText = json.message || 'No tracking information found.';
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        errorEl.innerText = 'No tracking information found.';
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
